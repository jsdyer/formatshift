name: Music metadata · Collect a receipt
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to collect (opening uses editable web/config.json release IDs)
        type: choice
        options: [opening, artist, release-group, release]
        default: opening
      identifier:
        description: MusicBrainz UUID for artist / release-group / release (blank for opening)
        type: string
      limit:
        description: Maximum releases to retain for a browse (1–2000)
        type: string
        default: '100'
permissions:
  contents: read
concurrency:
  group: musicbrainz-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect identified and paced API metadata
        env:
          MODE: ${{ inputs.mode }}
          IDENTIFIER: ${{ inputs.identifier }}
          LIMIT: ${{ inputs.limit }}
        run: python3 scripts/collect.py --mode "$MODE" --id "$IDENTIFIER" --limit "$LIMIT" --output receipts/formatshift-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: formatshift-receipt
          path: receipts/formatshift-receipt.json
          retention-days: 30
      - name: Explain the result
        run: |
          echo 'Download the formatshift-receipt artifact and import its JSON into Format Shift. This workflow does not change the published opening collection. To replace that collection, commit the reviewed JSON as web/data/opening.json.' >> "$GITHUB_STEP_SUMMARY"
